name: Signatur einrichten

# One-time setup of the permanent app signing key. The key is generated here, protected by the
# SIGNING_PASSWORD repository secret, and committed as signing/release.p12. The password itself
# never enters the repository or the logs.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Schlüssel erzeugen und speichern
        env:
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          if [ -z "$SIGNING_PASSWORD" ]; then
            echo "::error::Lege zuerst das Repository-Secret SIGNING_PASSWORD an (Settings → Secrets and variables → Actions)."
            exit 1
          fi
          if [ ${#SIGNING_PASSWORD} -lt 12 ]; then
            echo "::error::SIGNING_PASSWORD sollte mindestens 12 Zeichen lang sein."
            exit 1
          fi
          if [ -f signing/release.p12 ]; then
            echo "::notice::signing/release.p12 existiert bereits – nichts zu tun. Ein neuer Schlüssel würde Updates der installierten App verhindern."
            exit 0
          fi
          mkdir -p signing
          keytool -genkeypair -keystore signing/release.p12 -storetype PKCS12 \
            -alias heliolink -keyalg RSA -keysize 4096 -validity 36500 \
            -storepass:env SIGNING_PASSWORD -keypass:env SIGNING_PASSWORD \
            -dname "CN=HelioLink, O=Personal"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f signing/release.p12
          git commit -m "Add app signing key (protected by SIGNING_PASSWORD secret)"
          git push
          echo "::notice::Signatur eingerichtet. Ab jetzt sind alle Releases gleich signiert."
